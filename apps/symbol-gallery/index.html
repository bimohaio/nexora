<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industrial Symbol Gallery</title>
  </head>
  <body>
    <header class="gallery-header">
      <div>
        <p class="eyebrow">Web SCADA Engine · Composite Library</p>
        <h1>Industrial Symbol Library</h1>
        <p>Metadata-driven symbols with SVG-local visuals and normalized ports.</p>
      </div>
      <div class="gallery-controls" aria-label="Gallery preview controls">
        <label>
          Search
          <input id="gallery-search" type="search" placeholder="Pump, valve, sensor…" />
        </label>
        <label>
          Category
          <select id="category-select">
            <option value="">All categories</option>
          </select>
        </label>
        <label>
          Runtime state
          <select id="state-select">
            <option value="normal">Normal</option>
            <option value="running">Running</option>
            <option value="active">Active</option>
            <option value="warning">Warning</option>
            <option value="alarm">Alarm</option>
            <option value="offline">Offline</option>
            <option value="disabled">Disabled</option>
          </select>
        </label>
        <label>
          Variant
          <select id="variant-select">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
          </select>
        </label>
        <label>
          Rotation
          <select id="rotation-select">
            <option value="0">0°</option>
            <option value="90">90°</option>
            <option value="180">180°</option>
            <option value="270">270°</option>
          </select>
        </label>
        <button id="theme-toggle" type="button">Use light theme</button>
        <button id="size-toggle" type="button">Show minimum sizes</button>
      </div>
    </header>
    <main id="gallery" aria-live="polite"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
