<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web SCADA Designer</title>
  </head>
  <body>
    <div class="designer-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">NX</span>
          <div><strong>Nexora Designer</strong><small>Phase 8 · Binding Authoring</small></div>
        </div>
        <nav class="toolbar" aria-label="Designer tools">
          <button type="button" data-tool="select" aria-pressed="true">Select <kbd>V</kbd></button>
          <button type="button" data-tool="pan" aria-pressed="false">Pan <kbd>H</kbd></button>
          <button type="button" data-tool="rectangle" aria-pressed="false">
            Rectangle <kbd>R</kbd>
          </button>
          <button type="button" data-tool="connection" aria-pressed="false">
            Connection <kbd>C</kbd>
          </button>
        </nav>
        <div class="history-controls">
          <button id="undo" type="button" aria-label="Undo" disabled>↶</button>
          <button id="redo" type="button" aria-label="Redo" disabled>↷</button>
          <button id="fit" type="button">Fit</button>
          <button id="center-selection" type="button">Center selection</button>
        </div>
      </header>

      <aside class="palette-panel">
        <h2>Symbols</h2>
        <label class="search-label"
          >Search
          <input id="symbol-search" type="search" placeholder="Pump, valve, sensor…" />
        </label>
        <div id="symbol-palette" class="symbol-palette"></div>
      </aside>

      <main class="canvas-column">
        <div
          id="designer-canvas"
          class="designer-canvas"
          tabindex="0"
          aria-label="SCADA designer canvas"
        >
          <div id="renderer-host" class="renderer-host"></div>
          <svg id="designer-overlay" class="designer-overlay" aria-hidden="true"></svg>
        </div>
        <footer class="statusbar">
          <output id="status">Ready</output>
          <output id="viewport-status">100%</output>
        </footer>
      </main>

      <aside class="inspector-panel">
        <h2>Inspector</h2>
        <div id="empty-inspector" class="empty-state">Select one node to edit properties.</div>
        <form id="node-inspector" hidden>
          <label>Name <input name="name" type="text" /></label>
          <div class="field-grid">
            <label>X <input name="x" type="number" step="1" /></label>
            <label>Y <input name="y" type="number" step="1" /></label>
            <label>Width <input name="width" type="number" min="1" step="1" /></label>
            <label>Height <input name="height" type="number" min="1" step="1" /></label>
            <label>Rotation <input name="rotation" type="number" step="1" /></label>
            <label>Fill <input name="fill" type="color" /></label>
          </div>
          <div class="order-controls" aria-label="Node ordering">
            <button type="button" data-order="front">Front</button>
            <button type="button" data-order="forward">Forward</button>
            <button type="button" data-order="backward">Backward</button>
            <button type="button" data-order="back">Back</button>
          </div>
        </form>
        <section id="binding-panel" class="binding-panel" aria-labelledby="binding-title" hidden>
          <div class="section-heading">
            <div>
              <h3 id="binding-title">Data bindings</h3>
              <p>Runtime-safe authoring preview</p>
            </div>
            <output id="binding-count" class="binding-count">0</output>
          </div>
          <div id="binding-list" class="binding-list" aria-label="Bindings for selected node"></div>
          <form id="binding-form" class="binding-form" data-shortcut-guard>
            <label
              >Target property
              <select name="property" aria-label="Binding target property"></select>
            </label>
            <label
              >Source type
              <select name="sourceType" aria-label="Binding source type">
                <option value="tag">Runtime tag</option>
                <option value="expression">Safe expression</option>
                <option value="constant">Constant value</option>
              </select>
            </label>
            <label
              ><span id="binding-source-label">Runtime tag ID</span>
              <input name="source" type="text" value="plant.cooling.level" autocomplete="off" />
            </label>
            <label
              >Fallback (JSON)
              <input name="fallback" type="text" value="0" autocomplete="off" />
            </label>
            <button type="submit" class="binding-create">＋ Create binding</button>
            <output id="binding-form-status" class="binding-form-status"></output>
          </form>
        </section>
        <section class="shortcuts">
          <h3>Shortcuts</h3>
          <p><kbd>Ctrl/Cmd</kbd> + C/X/V/D · Z · Shift+Z · A</p>
          <p><kbd>Delete</kbd> remove · <kbd>Esc</kbd> cancel</p>
        </section>
        <section class="advanced-actions" aria-label="Advanced editing">
          <h3>Advanced editing</h3>
          <div class="order-controls">
            <button id="rotate-left" type="button">↺ 15°</button>
            <button id="rotate-right" type="button">↻ 15°</button>
            <button id="group" type="button">Group</button>
            <button id="ungroup" type="button">Ungroup</button>
            <button id="lock" type="button">Lock</button>
            <button id="unlock" type="button">Unlock</button>
            <button id="hide" type="button">Hide</button>
          </div>
          <label
            >Align
            <select id="align">
              <option value="">Choose…</option>
              <option value="left">Left</option>
              <option value="horizontal-center">Horizontal center</option>
              <option value="right">Right</option>
              <option value="top">Top</option>
              <option value="vertical-center">Vertical center</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
          <div class="order-controls">
            <button id="distribute-horizontal" type="button">Distribute H</button>
            <button id="distribute-vertical" type="button">Distribute V</button>
          </div>
          <label
            >Move to layer
            <select id="layer-target"></select>
          </label>
          <div class="order-controls" aria-label="Connection waypoint editing">
            <button id="add-waypoint" type="button">Add waypoint</button>
            <button id="remove-waypoint" type="button">Remove waypoint</button>
          </div>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
